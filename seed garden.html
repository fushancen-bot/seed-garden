<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>种子花园 · 脑洞</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--paper-bg);font-family:var(--font-current);color:var(--paper-ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:font-family .25s}
html[data-font="serif"] body{font-family:'Noto Serif SC','Songti SC','STSong',serif}
html[data-font="system"] body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro','PingFang SC','Helvetica Neue',sans-serif;font-weight:400}
/* when system font is picked, English/numerals (--font-accent) follow too */
html[data-font="system"] body{--font-accent:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro','PingFang SC','Helvetica Neue',sans-serif;--font-italic:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro','PingFang SC','Helvetica Neue',sans-serif}
body::before{content:'';position:fixed;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-120px;right:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(ellipse,rgba(107,140,94,.05) 0%,transparent 70%);animation:xs-breathe 8s ease-in-out infinite;pointer-events:none;z-index:0}

.container{max-width:680px;margin:0 auto;padding:0 24px;position:relative;z-index:2}

/* Header with inline font + theme pills */
header{padding:40px 0 28px;animation:xs-fadeUp .8s ease-out both}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:26px;font-weight:600;letter-spacing:.06em;display:flex;align-items:baseline;gap:8px}
h1 .accent{display:inline-block;border-bottom:2px solid rgba(107,140,94,.4);padding-bottom:2px}
h1 .leaf{font-size:16px;color:rgba(107,140,94,.7);margin-left:4px}
.garden-meta{font-family:var(--font-accent);font-size:12.5px;color:var(--paper-ink-3);font-style:italic;letter-spacing:.04em;margin-top:6px}
html[data-font="system"] .garden-meta{font-style:normal}

/* Pill-shaped font switcher next to title (like 碎碎念 page) */
.head-controls{display:flex;align-items:center;gap:8px}
.font-pill{display:inline-flex;align-items:center;gap:0;padding:3px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(139,115,85,.12);box-shadow:0 1px 2px rgba(42,37,32,.03)}
.fbtn{font-size:13px;padding:6px 14px;border-radius:999px;border:none;background:transparent;color:var(--paper-ink-3);cursor:pointer;transition:all .2s;font-family:inherit;line-height:1}
.fbtn.sel{background:rgba(139,115,85,.14);color:var(--paper-ink);font-weight:500}
.fbtn:hover:not(.sel){color:var(--paper-ink-2)}
/* round A button (placeholder for extra font, optional) */
.round-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(139,115,85,.14);background:rgba(255,255,255,.5);cursor:pointer;font-family:var(--font-accent);font-style:italic;font-size:15px;color:var(--paper-ink-3);display:flex;align-items:center;justify-content:center;transition:all .2s}
.round-btn:hover{background:rgba(255,255,255,.8);color:var(--paper-ink-2)}

/* Filter */
.filters{display:flex;gap:6px;padding:14px 0 0;flex-wrap:wrap}
.fchip{font-family:var(--font-current);font-size:12.5px;padding:5px 14px;border-radius:14px;border:1px solid rgba(139,115,85,.12);background:rgba(255,255,255,.4);color:var(--paper-ink-2);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px}
.fchip:hover{background:rgba(255,255,255,.7)}
.fchip.sel{background:rgba(107,140,94,.14);border-color:rgba(107,140,94,.3);color:rgba(60,100,55,.9);font-weight:500}
.fchip .c{font-size:11px;color:var(--paper-ink-3);font-family:var(--font-accent);font-style:italic}
.fchip.sel .c{color:rgba(60,100,55,.7)}

/* New seed composer — clean paper card, no dashed border */
.composer{margin:20px 0 32px;padding:22px 24px 18px;background:rgba(255,255,255,.62);border-radius:14px;border:1px solid rgba(139,115,85,.1);box-shadow:0 1px 0 rgba(139,115,85,.05),0 4px 14px rgba(42,37,32,.03);position:relative;animation:xs-fadeUp .6s ease-out .1s both;transition:box-shadow .25s,border-color .25s}
.composer:focus-within{border-color:rgba(107,140,94,.35);box-shadow:0 1px 0 rgba(139,115,85,.05),0 6px 20px rgba(42,37,32,.06)}
.composer textarea{width:100%;min-height:66px;font-family:inherit;font-size:14px;font-weight:300;color:var(--paper-ink);background:transparent;border:none;outline:none;resize:vertical;line-height:1.95}
.composer .bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(139,115,85,.08);gap:10px}
.composer .hint{font-size:11.5px;color:var(--paper-ink-3);font-family:var(--font-accent);font-style:italic;letter-spacing:.02em}
html[data-font="system"] .composer .hint{font-style:normal}
.btn-plant{font-family:inherit;font-size:12.5px;padding:6px 20px;border-radius:14px;border:none;background:rgba(107,140,94,.14);color:rgba(90,120,80,.4);cursor:default;transition:all .3s;letter-spacing:.04em}
.btn-plant.ready{background:rgba(90,120,80,.85);color:#f6f2ec;cursor:pointer}
.btn-plant.ready:hover{background:rgba(75,105,68,.95)}

/* Seed entry */
.seeds{padding-bottom:60px}
.date-sep{font-family:var(--font-accent);font-size:12.5px;color:rgba(139,115,85,.52);font-style:italic;letter-spacing:.06em;margin:24px 0 14px;display:flex;align-items:center;gap:12px}
.date-sep::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(139,115,85,.12),transparent)}

.seed{margin-bottom:26px;padding:16px 0 16px 28px;position:relative;cursor:pointer;transition:all .3s;animation:xs-fadeUp .5s ease-out both;border-radius:8px;margin-left:-10px;padding-left:38px}
.seed:hover{background:rgba(255,255,255,.35)}
.seed.recent{background:rgba(255,249,230,.45);box-shadow:0 1px 0 rgba(212,154,62,.08)}

.seed .stage{position:absolute;left:8px;top:18px;font-size:16px;line-height:1;transition:transform .3s}
.seed:hover .stage{transform:scale(1.15) rotate(-6deg)}

.seed .head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.seed .time{font-family:var(--font-accent);font-size:12px;color:rgba(139,115,85,.55);font-style:italic;letter-spacing:.03em}
.seed .waters{font:var(--t-hint);color:rgba(107,140,94,.7);font-family:var(--font-accent);font-style:italic;display:flex;align-items:center;gap:3px}
.seed .stage-label{font-family:var(--font-current);font-size:11px;color:var(--paper-ink-3);background:rgba(107,140,94,.08);padding:1px 8px;border-radius:8px}
.seed .recent-badge{font-family:var(--font-accent);font-size:10.5px;color:rgba(212,154,62,.85);background:rgba(212,154,62,.12);padding:1px 8px;border-radius:8px;font-style:italic}

.seed .body{font-size:16px;font-weight:400;color:#000;line-height:1.8;white-space:pre-wrap;word-break:break-word}
html[data-font="system"] .seed .body{font-size:14.5px}
html[data-font="system"] .editor textarea{font-size:13.5px}
html[data-font="system"] .composer textarea{font-size:13.5px}
.seed.seedling .body{color:rgba(0,0,0,.55)}
.seed.growing{}

.seed .body .mention{color:rgba(90,120,80,.95);font-style:italic;font-family:var(--font-italic);border-bottom:1px dotted rgba(107,140,94,.3);cursor:pointer;padding:0 1px}
.seed .body .mention:hover{background:rgba(107,140,94,.08)}

.seed .links{margin-top:10px;display:flex;align-items:center;gap:6px;font-family:var(--font-accent);font-size:11.5px;color:rgba(139,115,85,.6);font-style:italic;flex-wrap:wrap}
.seed .links .llabel{color:var(--paper-ink-3)}
.seed .links .ll{padding:1px 8px;border-radius:8px;background:rgba(107,140,94,.06);color:rgba(90,120,80,.8);cursor:pointer;transition:background .2s;font-family:var(--font-current);font-size:11.5px;font-style:normal}
.seed .links .ll:hover{background:rgba(107,140,94,.14)}

/* Empty */
.empty{text-align:center;padding:60px 0;color:var(--paper-ink-3);font-family:var(--font-accent);font-style:italic;font-size:14px}
.empty .e{font-size:28px;margin-bottom:10px;opacity:.6}

/* Editor overlay */
.backdrop{position:fixed;inset:0;background:rgba(246,242,236,.7);backdrop-filter:blur(12px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.show{opacity:1;pointer-events:auto}
.editor{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);width:min(640px,calc(100vw - 40px));max-height:calc(100vh - 60px);background:#fdfaf4;border-radius:18px;border:1px solid rgba(139,115,85,.12);box-shadow:0 20px 60px rgba(42,37,32,.16);z-index:101;padding:28px 30px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;overflow:hidden}
.editor.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.editor .ehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.editor .ehead-l{display:flex;align-items:center;gap:10px}
.editor .big-stage{font-size:22px}
.editor .ehead-meta{font-family:var(--font-accent);font-size:12.5px;color:var(--paper-ink-3);font-style:italic}
.editor .ehead-actions{display:flex;gap:6px;flex-wrap:wrap}
.eab{font-family:var(--font-current);font-size:12px;padding:5px 12px;border-radius:12px;border:1px solid rgba(139,115,85,.15);background:rgba(255,255,255,.7);cursor:pointer;color:var(--paper-ink-2);transition:all .18s;display:flex;align-items:center;gap:4px}
.eab:hover{background:rgba(255,255,255,1);color:var(--paper-ink)}
.eab.water:hover{color:rgba(90,120,80,.9);border-color:rgba(107,140,94,.3)}
.eab.bloom{background:rgba(232,168,195,.14);border-color:rgba(199,130,162,.28);color:rgba(160,90,125,.9)}
.eab.bloom:hover{background:rgba(232,168,195,.22)}
.eab.danger:hover{color:#b05050}
.editor textarea{flex:1;width:100%;min-height:280px;font-family:inherit;font-size:14.5px;font-weight:400;color:#000;background:transparent;border:none;outline:none;resize:none;line-height:2}
.editor .efoot{margin-top:14px;padding-top:12px;border-top:1px solid rgba(139,115,85,.08);display:flex;justify-content:space-between;align-items:center;font-family:var(--font-accent);font-size:11.5px;color:var(--paper-ink-3);font-style:italic;flex-wrap:wrap;gap:8px}
.editor .efoot .saved{color:rgba(107,140,94,.75)}

/* @ suggestion popup */
.mention-pop{position:absolute;background:#fdfaf4;border:1px solid rgba(139,115,85,.15);border-radius:10px;box-shadow:0 6px 20px rgba(42,37,32,.1);min-width:180px;max-width:260px;max-height:180px;overflow-y:auto;z-index:110;padding:4px}
.mention-pop .mi{padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--paper-ink);display:flex;gap:8px;align-items:center}
.mention-pop .mi:hover,.mention-pop .mi.active{background:rgba(107,140,94,.12)}
.mention-pop .mi .s{font-size:12px}
.mention-pop .mi .t{font-family:var(--font-accent);font-size:11px;color:var(--paper-ink-3);font-style:italic;margin-left:auto}
.mention-pop .none{padding:8px 10px;color:var(--paper-ink-3);font-size:12px;font-family:var(--font-accent);font-style:italic}

/* Bloom archive drawer */
.bloom-toggle{position:fixed;bottom:20px;right:20px;background:#fdfaf4;border:1px solid rgba(199,130,162,.2);border-radius:20px;padding:8px 16px;font-family:var(--font-current);font-size:12.5px;color:rgba(160,90,125,.95);cursor:pointer;box-shadow:0 2px 10px rgba(42,37,32,.06);z-index:50;display:flex;align-items:center;gap:6px;transition:all .22s}
.bloom-toggle:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(42,37,32,.09)}
.bloom-drawer{position:fixed;top:0;right:-420px;width:min(400px,90vw);height:100vh;background:#fdfaf4;border-left:1px solid rgba(139,115,85,.12);box-shadow:-4px 0 22px rgba(42,37,32,.08);z-index:99;transition:right .35s cubic-bezier(.2,.7,.2,1);padding:60px 26px 30px;overflow-y:auto}
.bloom-drawer.show{right:0}
.bloom-drawer h2{font-size:18px;font-weight:500;letter-spacing:.04em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.bloom-drawer .sub{font-family:var(--font-accent);font-style:italic;font-size:12px;color:var(--paper-ink-3);margin-bottom:22px}
.bloom-drawer .bclose{position:absolute;top:16px;right:18px;background:none;border:none;font-size:20px;color:var(--paper-ink-3);cursor:pointer;line-height:1}
.bloom-item{padding:14px 0;border-bottom:1px solid rgba(139,115,85,.08)}
.bloom-item:last-child{border-bottom:none}
.bloom-item .bt{font-family:var(--font-accent);font-size:11.5px;color:var(--paper-ink-3);font-style:italic;margin-bottom:4px}
.bloom-item .bb{font-size:14px;font-weight:300;color:rgba(42,37,32,.85);line-height:1.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bloom-item .bact{margin-top:8px;display:flex;gap:8px;font-family:var(--font-accent);font-size:11.5px;font-style:italic}
.bloom-item .bact a{color:rgba(107,140,94,.8);cursor:pointer;border-bottom:1px dotted rgba(107,140,94,.3)}
.bloom-item .bact a:hover{color:rgba(60,100,55,.95)}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(253,250,244,.96);backdrop-filter:blur(12px);border:1px solid rgba(107,140,94,.2);padding:10px 20px;border-radius:14px;font-family:var(--font-current);font-size:13px;color:var(--paper-ink);box-shadow:0 4px 18px rgba(42,37,32,.1);opacity:0;pointer-events:none;transition:all .3s;z-index:200;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bloom{border-color:rgba(199,130,162,.3)}

.footer-note{padding:30px 0;text-align:center;font-family:var(--font-accent);font-size:11.5px;color:var(--paper-ink-3);font-style:italic;letter-spacing:.06em}
.footer-note .l{width:24px;height:1px;background:rgba(139,115,85,.18);margin:0 auto 12px}

/* ---- overrides: no italics, unified ink color ---- */
/* kill italics globally on this page (English + numerals included) */
body, body *{font-style:normal !important}
/* unify text color — keep meta/hint/label slightly lighter for hierarchy but still near-black */
.garden-meta,
.fbtn, .fbtn.sel,
.fchip, .fchip.sel, .fchip .c, .fchip.sel .c,
.composer .hint,
.btn-plant, .btn-plant.ready,
.date-sep,
.seed .time, .seed .waters, .seed .stage-label, .seed .recent-badge,
.seed .body, .seed.seedling .body,
.seed .links, .seed .links .llabel, .seed .links .ll,
.empty,
.editor .ehead-meta, .eab, .editor textarea, .editor .efoot, .editor .efoot .saved,
.mention-pop .mi, .mention-pop .mi .t, .mention-pop .none,
.bloom-toggle, .bloom-drawer h2, .bloom-drawer .sub,
.bloom-item .bt, .bloom-item .bb, .bloom-item .bact, .bloom-item .bact a,
.toast,
.footer-note,
h1, h1 .accent, h1 .leaf{
  color:#000 !important;
}
/* keep button backgrounds & borders, but darken their text */
.btn-plant.ready{color:#f6f2ec !important} /* plant button stays light-on-green */
</style>
</head>
<body>
<div class="container" id="root"></div>
